<form id="trade-entry-form">
    <input type="hidden" id="trade-source-id" name="source_id" value="manual" />
    <input type="hidden" id="idea-strategy-id" name="strategy_id" />
    <input type="hidden" id="is-paper-trade" name="is_paper_trade" value="" />
    <label for="trade-ticker">Ticker:</label>
    <input type="text" id="trade-ticker" name="ticker" required />

    <div id="quantity-container">
        <label for="trade-quantity">Quantity:</label>
        <input type="number" id="trade-quantity" name="quantity" required />
    </div>

    <label for="trade-price">Purchase Price:</label>
    <input type="number" id="trade-price" name="price" step="0.01" required />

    <input type="hidden" id="idea-id" name="id" />

    <label for="idea-buy-low">Buy Price Low:</label>
    <input type="number" id="idea-buy-low" name="buy_price_low" step="0.01" />

    <label for="idea-buy-high">Buy Price High:</label>
    <input type="number" id="idea-buy-high" name="buy_price_high" step="0.01" />

    <label for="idea-tp-low">Take Profit Low:</label>
    <input type="number" id="idea-tp-low" name="take_profit_low" step="0.01" />

    <label for="idea-tp-high">Take Profit High:</label>
    <input type="number" id="idea-tp-high" name="take_profit_high" step="0.01" />

    <label for="idea-escape">Escape Price:</label>
    <input type="number" id="idea-escape" name="escape_price" step="0.01" />

    <label for="idea-notes">Notes:</label>
    <textarea id="idea-notes" name="notes"></textarea>
</form>
