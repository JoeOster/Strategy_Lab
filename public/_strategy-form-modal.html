<form id="log-strategy-form">
  <input type="hidden" id="strategy-id" name="id" />
  <input type="hidden" id="strategy-source-id" name="source_id" />
  <div class="form-grid">
    <div class="form-group">
      <label for="strategy-title">Title:</label>
      <input type="text" id="strategy-title" name="title" required />
    </div>
    <div class="form-group">
      <label for="strategy-ticker">Ticker:</label>
      <input type="text" id="strategy-ticker" name="ticker" />
    </div>
    <div class="form-group">
      <label for="strategy-chapter">Chapter:</label>
      <input type="text" id="strategy-chapter" name="chapter" />
    </div>
    <div class="form-group">
      <label for="strategy-page-number">Page Number:</label>
      <input type="text" id="strategy-page-number" name="page_number" />
    </div>
    <div class="form-group">
      <label for="strategy-pdf-path">PDF Path:</label>
      <input type="text" id="strategy-pdf-path" name="pdf_path" />
    </div>
  </div>

  <div class="form-group">
    <label for="strategy-description">Description:</label>
    <textarea id="strategy-description" name="description"></textarea>
  </div>
</form>
