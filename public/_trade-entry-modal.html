<div id="trade-entry-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">Enter Trade</h3>
            <span class="close-button">&times;</span>
        </div>
        <div class="modal-body">
            <form id="trade-entry-form">
                <input type="hidden" id="trade-source-id" name="source_id" value="manual" />
                <input type="hidden" id="is-paper-trade" name="is_paper_trade" value="" />
                <label for="trade-ticker">Ticker:</label>
                <input type="text" id="trade-ticker" name="ticker" required />

                <div id="quantity-container">
                    <label for="trade-quantity">Quantity:</label>
                    <input type="number" id="trade-quantity" name="quantity" required />
                </div>

                <label for="trade-price">Price:</label>
                <input type="number" id="trade-price" name="price" step="0.01" required />

                <label for="trade-limit-low">Limit Low:</label>
                <input type="number" id="trade-limit-low" name="limit_low" step="0.01" />

                <label for="trade-limit-high">Limit High:</label>
                <input type="number" id="trade-limit-high" name="limit_high" step="0.01" />

                <div class="form-actions">
                    <button type="submit" class="btn">Save Trade</button>
                    <button type="button" id="cancel-trade-form-btn" class="btn secondary-btn">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
