<div id="sell-trade-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title">Sell Trade</h3>
      <span class="close-button">&times;</span>
    </div>
    <div class="modal-body">
      <!-- Trade details will be rendered here -->
      <div id="sell-trade-details"></div>

      <form id="sell-trade-form">
        <input type="hidden" id="sell-trade-id" name="trade_id" />

        <label for="sell-quantity">Quantity to Sell:</label>
        <input
          type="number"
          id="sell-quantity"
          name="quantity"
          required
          step="any"
        />

        <label for="sell-price">Sell Price:</label>
        <input
          type="number"
          id="sell-price"
          name="price"
          required
          step="0.01"
        />

        <div class="form-actions">
          <button type="submit" id="confirm-sell-btn" class="btn btn-danger">
            Confirm Sell
          </button>
          <button type="button" id="cancel-sell-btn" class="btn secondary-btn">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
